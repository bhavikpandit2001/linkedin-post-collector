<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LinkedIn Post Collector</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <div id="app" class="app-shell">
      <!-- Top Bar -->
      <header class="topbar">
        <div class="topbar__brand">
          <span class="topbar__logo">in</span>
          <div>
            <h1 class="topbar__title">Post Collector</h1>
            <p class="topbar__subtitle">Local Browser Storage</p>
          </div>
        </div>
        <div class="topbar__actions">
          <span id="postCountBadge" class="badge">0</span>
          <button id="exportCsvBtn" class="btn btn--primary btn--sm" title="Download Excel CSV">
            Export CSV
          </button>
          <button id="clearAllBtn" class="btn btn--ghost btn--sm" title="Clear all saved posts">
            Clear
          </button>
        </div>
      </header>

      <!-- Posts Dashboard View -->
      <main id="dashboardView" class="dashboard-view">
        <section class="toolbar">
          <input
            id="searchInput"
            type="search"
            class="toolbar__search"
            placeholder="Search author, text, notes, #tag..."
          />
          <select id="typeFilter" class="toolbar__select" aria-label="Filter by post type">
            <option value="all">All types</option>
            <option value="text">Text</option>
            <option value="image">Image</option>
            <option value="video">Video</option>
            <option value="article">Article</option>
            <option value="document">Document</option>
            <option value="poll">Poll</option>
            <option value="repost">Repost</option>
          </select>
          <button id="refreshBtn" class="btn btn--secondary btn--sm" title="Refresh">
            ↻
          </button>
        </section>

        <p id="statusBanner" class="status-banner hidden"></p>

        <section class="table-container">
          <table class="posts-table">
            <thead>
              <tr>
                <th>Author</th>
                <th>Post Preview</th>
                <th>Type</th>
                <th class="col-actions">Actions</th>
              </tr>
            </thead>
            <tbody id="postsTableBody"></tbody>
          </table>

          <div id="emptyState" class="empty-state hidden">
            <p class="empty-state__title">No saved posts yet</p>
            <p class="empty-state__desc">
              Scroll your LinkedIn feed and click <strong>Extract Post</strong> beneath any post.
            </p>
          </div>
        </section>
      </main>

      <!-- Slide-Over Detail / Edit Drawer -->
      <div id="drawerBackdrop" class="drawer-backdrop hidden"></div>
      <aside id="detailDrawer" class="drawer hidden" aria-hidden="true">
        <div class="drawer__header">
          <div>
            <h2 class="drawer__title">Post Details</h2>
            <span id="drawerMeta" class="drawer__meta"></span>
          </div>
          <button id="closeDrawerBtn" class="btn btn--ghost btn--sm" type="button">✕</button>
        </div>

        <div class="drawer__body">
          <div class="drawer__metrics" id="drawerMetrics"></div>

          <div class="form-group">
            <label for="drawerAuthorInput">Author Name</label>
            <input id="drawerAuthorInput" type="text" />
          </div>

          <div class="form-group">
            <label for="drawerTextInput">Post Text</label>
            <textarea id="drawerTextInput" rows="6"></textarea>
          </div>

          <div class="form-group">
            <label for="drawerNotesInput">Notes</label>
            <textarea
              id="drawerNotesInput"
              rows="3"
              placeholder="Add personal notes or takeaways..."
            ></textarea>
          </div>

          <div class="drawer__tags" id="drawerHashtags"></div>
          <div class="drawer__tags" id="drawerMentions"></div>
          <div class="drawer__media" id="drawerMedia"></div>
        </div>

        <div class="drawer__footer">
          <a
            id="drawerOpenLink"
            href="#"
            target="_blank"
            rel="noopener noreferrer"
            class="btn btn--secondary btn--sm"
          >
            Open on LinkedIn ↗
          </a>
          <div class="drawer__footer-right">
            <button id="drawerDeleteBtn" class="btn btn--danger btn--sm" type="button">
              Delete
            </button>
            <button id="drawerSaveBtn" class="btn btn--primary btn--sm" type="button">
              Save Changes
            </button>
          </div>
        </div>
      </aside>
    </div>

    <script src="app.js"></script>
  </body>
</html>
